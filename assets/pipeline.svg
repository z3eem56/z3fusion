<svg viewBox="0 0 1010 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>Fusion panel to judge pipeline</title>
  <desc>A prompt fans out to several independent panelists (any model@runner mix, each answering blind with web + bash), which the orchestrating Claude Code session judges and synthesizes into consensus, contradictions, partial coverage, unique insights and blind spots, then writes a final grounded answer.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- connecting lines -->
  <g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M110,195 L152,195"/>

    <path d="M162,195 C205,195 210,50 250,50"/>
    <path d="M162,195 L250,195"/>
    <path d="M162,195 C205,195 210,340 250,340"/>

    <path d="M440,50 C500,50 520,195 558,195"/>
    <path d="M440,195 L558,195"/>
    <path d="M440,340 C500,340 520,195 558,195"/>

    <path d="M790,195 L838,195"/>
  </g>
  <circle cx="157" cy="195" r="3.5" fill="#94a3b8"/>
  <text x="175" y="215" font-size="11" font-style="italic" fill="#64748b">fan out</text>

  <!-- prompt -->
  <rect x="10" y="170" width="100" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="60" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">prompt</text>

  <!-- panelists -->
  <g>
    <rect x="250" y="15" width="190" height="70" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="345" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Panelist 1</text>
    <text x="345" y="63" text-anchor="middle" font-size="10.5" fill="#4f46e5">web + bash · independent</text>
  </g>
  <g>
    <rect x="250" y="160" width="190" height="70" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="345" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Panelist 2</text>
    <text x="345" y="208" text-anchor="middle" font-size="10.5" fill="#4f46e5">web + bash · independent</text>
  </g>
  <g>
    <rect x="250" y="305" width="190" height="70" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="345" y="335" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Panelist 3</text>
    <text x="345" y="353" text-anchor="middle" font-size="10.5" fill="#4f46e5">web + bash · independent</text>
  </g>

  <!-- orchestrating session -->
  <rect x="560" y="140" width="230" height="110" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
  <text x="675" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Orchestrating</text>
  <text x="675" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">session</text>
  <text x="675" y="228" text-anchor="middle" font-size="11" fill="#e0e7ff">(judge + synthesize)</text>

  <!-- final answer -->
  <rect x="840" y="145" width="150" height="100" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="915" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Final answer</text>
  <text x="915" y="205" text-anchor="middle" font-size="10.5" fill="#16a34a">(grounded in</text>
  <text x="915" y="220" text-anchor="middle" font-size="10.5" fill="#16a34a">the analysis)</text>

  <!-- captions -->
  <text x="345" y="402" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">any model@runner mix</text>
  <text x="345" y="419" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">(each answers blind)</text>

  <text x="775" y="402" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">consensus · contradictions · partial ·</text>
  <text x="775" y="419" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">unique insights · blind spots</text>
</svg>
